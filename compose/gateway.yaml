version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./data/gateway/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
  
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    env_file:
      - ../.env  # Load all environment variables from root .env file
    environment:
      # Override for local development
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
    volumes:
      # Mount source code for live editing (development only)
      - ../gateway:/app:rw
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8443:8443"
    restart: always
    # Enable hot reload for development
    command: uvicorn main:app --host 0.0.0.0 --port 8443 --reload