version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_ENVIRONMENT=development
      - APP_DEBUG=true
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=callcenterai
      - DB_USER=callcenterai
      - DB_PASSWORD=ChangeThisNow_!
      - SECURITY_ENCRYPTION_KEY=1234567890123456789012345678901234567890123456789012345678901234
      - SECURITY_JWT_SECRET=your_jwt_secret_at_least_32_characters_long_here
      - CLINIC_TOKEN_HMAC_KEY_BASE64=dGVzdF9obWFjX2tleV9mb3JfZGV2ZWxvcG1lbnRfb25seQ==
      - AES_GCM_KEY_BASE64=dGVzdF9hZXNfZ2NtX2tleV9mb3JfZGV2ZWxvcG1lbnRfb25seQ==
      - ACS_CONNECTION_STRING=endpoint=https://test.communication.azure.com/;accesskey=test
      - ACS_WEBHOOK_SECRET=test_webhook_secret_for_development
      - ACS_CALLBACK_URL=https://localhost:8080/api/v1/acs/webhooks/events
    depends_on:
      - postgres
    volumes:
      - ./gateway:/app
    command: ["./start_dev.sh"]
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=callcenterai
      - POSTGRES_USER=callcenterai
      - POSTGRES_PASSWORD=ChangeThisNow_!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
